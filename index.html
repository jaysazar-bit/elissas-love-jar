<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elissa's Little Jar of Love</title><style>body{margin:0;background:linear-gradient(145deg,#fff1f5,#ffe1e9);font-family:Georgia,serif;color:#79344d;text-align:center;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:35px 20px}h1{font-size:2.2rem}p{line-height:1.6}.jar{font-size:110px;filter:drop-shadow(0 10px 12px #d77b9b55);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}button{border:0;border-radius:18px;padding:16px 10px;background:#fff;color:#a34265;box-shadow:0 4px 12px #d87e9b30;font-size:15px;cursor:pointer}button:active{transform:scale(.97)}.note{background:#fffdf7;border-radius:20px;padding:25px;margin-top:20px;box-shadow:0 9px 25px #bd6a8530;min-height:110px;display:none;animation:pop .4s ease}.note.show{display:block}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}.footer{font-size:13px;margin-top:32px;opacity:.8}.heart{color:#db527d}</style></head><body><main class="wrap"><div class="heart">♥ ♥ ♥</div><h1>Elissa's Little Jar of Love</h1><p>For my favorite person, from your boy who loves you from miles away. Whenever you need me, pick a little note. I’m always right here with you.</p><div class="jar" aria-label="Jar of love notes">🫙💌</div><p><b>How is your heart feeling today, mon amour?</b></p><div class="buttons"><button onclick="openNote('miss')">🥺 I miss you</button><button onclick="openNote('stress')">📚 I'm stressed</button><button onclick="openNote('sad')">☁️ I'm feeling down</button><button onclick="openNote('smile')">🌷 Make me smile</button><button onclick="openNote('memory')">💕 Our memories</button><button onclick="openNote('kiss')">💋 I need a kiss</button></div><section id="note" class="note" aria-live="polite"></section><p class="footer">Made with all my love, just for you — Jay ♥</p></main><script>const notes={miss:["If I could teleport for one minute, I'd spend all sixty seconds holding you. Until then, imagine my arms around you, Elissa.","Every kilometer between us is temporary. You and me? That's the part I believe in.","Close your eyes, mon amour. That warm hug you're imagining? I'm saving the real one for you."],stress:["My brilliant girl, you don't need to do everything perfectly. I'm already so proud of the effort you put in every day.","One page, one breath, one little step at a time. And when you're done, your boy is here to listen to every detail.","If I were there, I'd bring you a snack, kiss your forehead, and remind you how capable you are."],sad:["You never have to pretend to be happy with me. I love every version of you, even on the difficult days.","I wish I could take the heavy feeling away. For now, let me remind you: you're deeply loved, always.","Even on cloudy days, you're still my favorite sunshine. Je t'aime, Elissa."],smile:["Official announcement: the prettiest smile in the world belongs to a girl named Elissa. I'm extremely biased and completely correct.","Your boyfriend is currently sending one invisible forehead kiss. Delivery status: successful. 💌","If loving you were an exam, I'd finally be the guy who never needs to revise."],memory:["I'll always treasure that night we spent at home watching a movie together. Nothing fancy, just you beside me, feeling completely at peace. The best part wasn't the movie, Elissa. It was being close to you and wishing our little night together could last forever. I'd choose that moment a thousand times.","From friends to this beautiful love story... sometimes the best things in life take their time.","My favorite memories aren't just places. They're the moments I look at you and think: there she is, my person."],kiss:["Mwah. One for your forehead, one for each cheek, and one very long kiss saved for when we're together.","Consider this your official voucher for unlimited kisses when I see you. No expiration date.","Come here, mon amour. Imagine me pulling you close and whispering how much I love you."]};let counts={};function openNote(kind){let i=counts[kind]||0;counts[kind]=i+1;let arr=notes[kind];let el=document.getElementById('note');el.classList.remove('show');void el.offsetWidth;el.textContent=arr[i%arr.length]+' ♥';el.classList.add('show');el.scrollIntoView({behavior:'smooth',block:'nearest'});}</script></body></html>
